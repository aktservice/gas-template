name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          for f in dist/backend.js dist/appsscript.json; do
            if [ ! -f "$f" ]; then
              echo "::error::期待する成果物が生成されていません: $f"
              exit 1
            fi
            echo "OK: $f"
          done
